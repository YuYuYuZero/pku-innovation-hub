<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>手机与小程序预览 · 创新学社</title>
<link rel="stylesheet" href="assets/app.css?v=20261113-mp1"><script src="assets/icons.js?v=20261113-mp1"></script><script src="assets/app.js?v=20261113-mp1"></script>
<style>
body { background: radial-gradient(60% 60% at 10% 0, #F4E4E5 0, transparent 60%), radial-gradient(50% 60% at 100% 100%, #F1E9DC 0, transparent 60%), #F6F5F2; }
/* 预览：两台手机加载同一页面，一台按手机浏览器，一台按微信小程序 */
.pv { padding: 32px 40px 48px; max-width: 1320px; }
.pv-ctl { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.pv-ctl .label { width: 64px; margin: 0; flex: none; }
.pv-ctl button.chip { font: inherit; font-size: 13px; cursor: pointer; }
.pv-stage { display: flex; gap: 28px; margin-top: 22px; align-items: flex-start; flex-wrap: wrap; }
.pv-stage figure { margin: 0; }
.dev { width: 399px; border-radius: 52px; background: #111; padding: 12px; box-shadow: var(--shadow-lg); position: relative; }
.dev-scr { width: 375px; height: 812px; border-radius: 40px; overflow: hidden; background: #fff; display: flex; flex-direction: column; position: relative; }
.dev-st { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-size: 14px; font-weight: 600; color: #000; background: #F6F5F2; }
.dev-st.w { background: #fff; }
.dev-notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 118px; height: 30px; border-radius: 18px; background: #111; z-index: 2; }
.dev iframe { width: 375px; flex: 1; border: 0; display: block; background: #F6F5F2; }
.dev-home { height: 26px; flex: none; background: rgba(255, 255, 255, .96); display: flex; align-items: center; justify-content: center; }
.dev-home i { width: 134px; height: 5px; border-radius: 3px; background: #111; }
.pv-stage figcaption { text-align: center; margin-top: 14px; font-weight: 600; color: var(--ink); font-size: 15px; }
.pv-stage figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.pv-note { width: 340px; flex: 1 1 300px; max-width: 440px; font-size: 13px; }
.pv-note h3 { font-size: 15px; margin: 4px 0 8px; }
.pv-note h3 + p, .pv-note ul { margin: 0 0 14px; }
.pv-note ul { padding-left: 18px; }
.pv-note li { margin: 5px 0; }
.pv-note code { font-size: 12px; background: #F2F1EE; padding: 1px 5px; border-radius: 5px; word-break: break-all; }
.pv-phone-links { display: none; }
@media (max-width: 767px) {
  .pv { padding: 20px 16px 32px; }
  .pv-ctl, .pv-stage figure { display: none; }
  .pv-phone-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .pv-note { width: auto; max-width: none; }
}
</style></head>
<body data-page="mobile">
<div class="pv">
  <h1 class="h-page">手机与小程序</h1>
  <p class="muted" style="margin-top:4px;max-width:900px">同一套页面在三种环境里自动切换：电脑浏览器显示侧边栏；手机浏览器显示顶栏和底部标签栏；微信小程序只是一个加载这些页面的壳，标题栏和右上角胶囊由微信绘制。下面两台手机加载的是同一个页面文件，可以直接点按操作。</p>
  <div class="pv-phone-links"><a class="btn btn-p" data-pv-open="web" href="index.html?v=20261113-mp1">打开手机版</a><a class="btn" data-pv-open="mp" href="index.html?env=mp&v=20261113-mp1">打开小程序效果</a></div>
  <div class="pv-ctl card pad">
    <div class="row wrap-x"><span class="label">页面</span><div class="chips" id="pv-pages"></div></div>
    <div class="row wrap-x"><span class="label">演示身份</span><div class="chips" id="pv-roles"></div></div>
    <div class="row wrap-x"><span class="label">小程序 AI</span><div class="chips" id="pv-ai"><button type="button" class="chip" data-ai="0">未开通类目（默认）</button><button type="button" class="chip" data-ai="1">已开通「深度合成」类目</button></div></div>
  </div>
  <div class="pv-stage">
    <figure><div class="dev"><div class="dev-scr"><div class="dev-notch"></div><div class="dev-st"><span>9:41</span><span>●●● 5G</span></div><iframe id="pv-web" title="手机浏览器预览"></iframe><div class="dev-home"><i></i></div></div></div>
      <figcaption>手机浏览器<span>微信里点开链接、Safari、飞书内置浏览器</span></figcaption></figure>
    <figure><div class="dev"><div class="dev-scr"><div class="dev-notch"></div><div class="dev-st w"><span>9:41</span><span>●●● 5G</span></div><iframe id="pv-mp" title="微信小程序预览"></iframe><div class="dev-home"><i></i></div></div></div>
      <figcaption>微信小程序<span>web-view 加载同一页面；标题栏和胶囊在此为模拟，真机上由微信绘制</span></figcaption></figure>
    <div class="pv-note card pad" id="pv-note">
      <h3>小程序里有什么不同</h3>
      <ul data-mp-diff></ul>
      <h3>在自己手机上看</h3>
      <p>直接打开任意页面就是手机版；地址后加 <code>?env=mp</code> 看小程序效果（页面自己画出微信标题栏）。真正放进小程序时不需要这个参数，页面按微信的标识自动切换。</p>
      <p class="xs muted">电脑上打开带 <code>?env=mp</code> 的地址，会自动回到这个预览页。</p>
    </div>
  </div>
</div>

<script>
const PV_PAGES = [["首页", "index.html"], ["活动", "events.html"], ["资源库", "resources.html"], ["资源详情", "resource_detail.html"], ["录入资源", "resource_new.html"], ["知识库", "kb.html"], ["文档详情", "kb_doc.html"], ["工作台", "workbench.html"], ["AI 工具箱", "assistant.html"], ["录入活动", "event_new.html"], ["审核与管理", "admin.html"], ["个人中心", "me.html"], ["登录", "login.html"]];
const PV_ROLES = [["president", "A 会长团"], ["minister", "B 部长"], ["backbone", "C 骨干"], ["maintainer", "D 维护人"], ["member", "E 会员"], ["outsider", "F 未入名单"]];
document.addEventListener("DOMContentLoaded", () => {
  document.querySelector("[data-mp-diff]").innerHTML = MP_DIFFS.map(([t, d]) => `<li><b>${t}</b>：${d}</li>`).join("");
  const q = new URLSearchParams(location.search);
  const start = new URL(q.get("page") || "index.html", location.href);
  let file = start.pathname.split("/").pop() || "index.html";
  let role = start.searchParams.get("role") || q.get("role") || "minister";
  const extra = new URLSearchParams(start.search); extra.delete("role"); extra.delete("v"); extra.delete("env");
  let hash = start.hash, mpai = extra.get("mpai") === "1" || q.get("mpai") === "1" ? "1" : "0"; extra.delete("mpai"); let keep = extra.toString();
  const src = (mp) => { const u = new URLSearchParams(keep); u.set("role", role); if (mp) { u.set("env", "mp"); if (mpai === "1") u.set("mpai", "1"); } u.set("v", DEMO_RELEASE); return `${file}?${u}${hash}`; };
  const load = () => {
    document.getElementById("pv-web").src = src(false);
    document.getElementById("pv-mp").src = src(true);
    document.querySelectorAll("#pv-pages button").forEach(b => b.classList.toggle("on", b.dataset.f === file));
    document.querySelectorAll("#pv-roles button").forEach(b => b.classList.toggle("on", b.dataset.r === role));
    document.querySelectorAll("#pv-ai button").forEach(b => b.classList.toggle("on", b.dataset.ai === mpai));
    const u = new URL(location.href); u.searchParams.set("page", src(false)); if (mpai === "1") u.searchParams.set("mpai", "1"); else u.searchParams.delete("mpai"); history.replaceState(null, "", u);
  };
  document.getElementById("pv-pages").innerHTML = PV_PAGES.map(([t, f]) => `<button type="button" class="chip" data-f="${f}">${t}</button>`).join("");
  document.getElementById("pv-roles").innerHTML = PV_ROLES.map(([r, t]) => `<button type="button" class="chip" data-r="${r}">${t}</button>`).join("");
  document.getElementById("pv-pages").onclick = (e) => { const b = e.target.closest("button"); if (b) { file = b.dataset.f; keep = ""; hash = ""; load(); } };
  document.getElementById("pv-roles").onclick = (e) => { const b = e.target.closest("button"); if (b) { role = b.dataset.r; load(); } };
  document.getElementById("pv-ai").onclick = (e) => { const b = e.target.closest("button"); if (b) { mpai = b.dataset.ai; load(); } };
  load();
});
</script>
</body></html>
